# Dependabot is used here for SECURITY updates only.
# Version updates are turned off (open-pull-requests-limit: 0) because routine
# upgrades are handled by a separate weekly maintenance process; security-update
# PRs ignore this limit and still open whenever a vulnerable dependency has a fix.
# Note: security-update PRs also need "Dependabot security updates" enabled in
# Settings > Code security.
version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
