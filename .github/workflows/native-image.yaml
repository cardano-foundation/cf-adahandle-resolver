name: Weekly Native Image

# GraalVM native image of the resolver (Oracle GraalVM, see Dockerfile.native for licensing): lower
# memory and faster startup than the JVM image.
# Built weekly from develop so native-image breakages surface early; a failed scheduled run
# opens (or updates) an issue labelled "native-image".
#
# Note: GitHub runs scheduled workflows from the default branch, so the schedule takes effect
# once this file is on main.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile.native'
      - '.github/workflows/native-image.yaml'
      - '.github/scripts/native-smoke-test.sh'
      - 'src/main/resources/META-INF/native-image/**'
      - 'src/main/java/org/cardanofoundation/tools/adahandle/resolver/config/NativeImageConfig.java'

permissions:
  contents: read
  issues: write

env:
  IMAGE: cardanofoundation/adahandle-resolver

jobs:
  native-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: adahandle
          POSTGRES_PASSWORD: adahandle
          POSTGRES_DB: adahandle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adahandle -d adahandle"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scheduled runs build develop; manual runs and PRs build their own ref.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Build native image
        run: docker build -f Dockerfile.native -t adahandle-resolver:native .

      - name: Image size
        run: docker image ls adahandle-resolver:native

      # Oracle GraalVM (GFTC): the image must carry Oracle's license and notices.
      - name: Check licenses in the image
        run: |
          for f in /licenses/LICENSE /licenses/graalvm/LICENSE.txt /licenses/graalvm/NOTICE.txt; do
            docker run --rm --entrypoint test adahandle-resolver:native -s "$f" || { echo "missing $f"; exit 1; }
          done
          docker run --rm --entrypoint head adahandle-resolver:native -n 2 /licenses/graalvm/LICENSE.txt

      - name: Smoke test (API, H2)
        run: .github/scripts/native-smoke-test.sh adahandle-resolver:native api

      - name: Smoke test (Flyway migrations, PostgreSQL)
        run: .github/scripts/native-smoke-test.sh adahandle-resolver:native postgres

      - name: Smoke test (mainnet sync, 3 minutes)
        run: .github/scripts/native-smoke-test.sh adahandle-resolver:native sync

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          tag="native-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          for t in native-weekly "$tag"; do
            docker tag adahandle-resolver:native "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "Pushed $IMAGE:native-weekly and $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The weekly native image build of develop ($(git rev-parse --short HEAD)) failed: $run_url"
          gh label create native-image --color 5319e7 --description "GraalVM native image build" 2>/dev/null || true
          issue=$(gh issue list --label native-image --state open --json number --jq '.[0].number')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Weekly native image build failed" --label native-image --body "$body"
          fi
