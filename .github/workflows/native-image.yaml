name: Native Image

# GraalVM native image of the resolver (Oracle GraalVM, see Dockerfile.native for licensing): lower memory and faster
# startup than the JVM image. Two uses:
#
# - A weekly check, and by hand on any branch: build the image and smoke-test it, publish nothing. GraalVM needs
#   reachability metadata (reflection, resources, proxies) that a dependency update or a code change can silently
#   invalidate; this catches it within a week. A failed scheduled run opens (or updates) an issue labelled
#   "native-image".
# - With each release: release.yaml calls it with the release tag. The same build and smoke tests, then
#   cardanofoundation/adahandle-resolver:<version>-native is pushed. No other native tag is published.
#
# Note: GitHub runs scheduled workflows from the default branch, so the schedule takes effect once this file is on
# main.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  # Not on pull requests (a native build takes ~25 min): run it by hand on a branch before merging a change that may
  # need new reachability metadata (dependency updates, NativeImageConfig, ...).
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish as <version>-native, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  native-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: adahandle
          POSTGRES_PASSWORD: adahandle
          POSTGRES_DB: adahandle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adahandle -d adahandle"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      # Scheduled runs build main (GitHub runs schedules on the default branch), manual runs their own branch, and
      # release runs the release tag.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      # The same check as publish.yaml: only X.Y.Z releases are published.
      - name: Check that the tag is a release
        if: inputs.tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pom.xml version $VERSION is not a release version; snapshots and pre-releases are not published"
            exit 1
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::tag $TAG does not match pom.xml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build native image
        run: docker build -f Dockerfile.native -t adahandle-resolver:native .

      - name: Image size
        run: docker image ls adahandle-resolver:native

      # Oracle GraalVM (GFTC): the image must carry Oracle's license and notices.
      - name: Check licenses in the image
        run: |
          for f in /licenses/LICENSE /licenses/graalvm/LICENSE.txt /licenses/graalvm/NOTICE.txt; do
            docker run --rm --entrypoint test adahandle-resolver:native -s "$f" || { echo "missing $f"; exit 1; }
          done
          docker run --rm --entrypoint head adahandle-resolver:native -n 2 /licenses/graalvm/LICENSE.txt

      - name: Smoke test (API, H2)
        run: .github/scripts/native-smoke-test.sh adahandle-resolver:native api

      - name: Smoke test (Flyway migrations, PostgreSQL)
        run: .github/scripts/native-smoke-test.sh adahandle-resolver:native postgres

      - name: Smoke test (mainnet sync, 3 minutes)
        run: .github/scripts/native-smoke-test.sh adahandle-resolver:native sync

      # Only for a release: the weekly and manual runs publish nothing.
      - name: Login to Docker Hub
        if: inputs.tag
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: inputs.tag
        run: |
          image="cardanofoundation/adahandle-resolver:${{ steps.version.outputs.version }}-native"
          docker tag adahandle-resolver:native "$image"
          docker push "$image"
          echo "Pushed $image from ${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The weekly native image build of main ($(git rev-parse --short HEAD)) failed: $run_url"
          gh label create native-image --color 5319e7 --description "GraalVM native image build" 2>/dev/null || true
          issue=$(gh issue list --label native-image --state open --json number --jq '.[0].number')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Weekly native image build failed" --label native-image --body "$body"
          fi
