name: Publish the Docker image

# Publishes cardanofoundation/adahandle-resolver:<version> for a release, and for nothing else. A final release
# (X.Y.Z) also moves :latest; a pre-release (a release candidate X.Y.Z-rcN, e.g. 1.0.0-rc1, or X.Y.Z-preN)
# doesn't, so :latest is always a final.
#
# - release.yaml calls it when release-please has just created a release. (A release created with the default
#   GITHUB_TOKEN doesn't start other workflows, so `on: release` would never fire.)
# - It can be run by hand for an existing release tag, e.g. to republish one.
#
# Snapshots (-SNAPSHOT, which release-please's Maven strategy bumps to after a release) and any other suffix are
# refused.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check that the tag is a release
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(rc|pre)[1-9][0-9]*$ ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::pom.xml version $VERSION is neither a release (X.Y.Z) nor a pre-release (X.Y.Z-rcN, X.Y.Z-preN); not published"
            exit 1
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::tag $TAG does not match pom.xml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: cardanofoundation/adahandle-resolver
          short-description: Scoped indexer for ADA Handle information, exposed via REST using Yaci Store

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # build-push-action v4+ attaches a provenance attestation by default; keep publishing a plain image.
          provenance: false
          file: ./Dockerfile
          context: .
          push: true
          # :latest only for a final release; build-push-action skips the empty line of a pre-release.
          tags: |
            cardanofoundation/adahandle-resolver:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.latest == 'true' && 'cardanofoundation/adahandle-resolver:latest' || '' }}

      - name: Summary
        run: |
          if [[ "${{ steps.version.outputs.latest }}" == true ]]; then also=" and :latest"; else also=" (pre-release, :latest unchanged)"; fi
          echo "Published cardanofoundation/adahandle-resolver:${{ steps.version.outputs.version }}$also from ${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
