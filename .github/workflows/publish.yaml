name: Publish the Docker image

# Publishes cardanofoundation/adahandle-resolver:<version> and :latest for a release, and for nothing else.
#
# - release.yaml calls it when release-please has just created a release. (A release created with the default
#   GITHUB_TOKEN doesn't start other workflows, so `on: release` would never fire.)
# - It can be run by hand for an existing release tag, e.g. to republish one.
#
# Snapshots (-SNAPSHOT, which release-please's Maven strategy bumps to after a release) and pre-releases (any version
# with a suffix) are refused, so :latest always points at a release.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check that the tag is a release
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pom.xml version $VERSION is not a release version; snapshots and pre-releases are not published"
            exit 1
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::tag $TAG does not match pom.xml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: cardanofoundation/adahandle-resolver
          short-description: Scoped indexer for ADA Handle information, exposed via REST using Yaci Store

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # build-push-action v4+ attaches a provenance attestation by default; keep publishing a plain image.
          provenance: false
          file: ./Dockerfile
          context: .
          push: true
          tags: |
            cardanofoundation/adahandle-resolver:${{ steps.version.outputs.version }}
            cardanofoundation/adahandle-resolver:latest

      - name: Summary
        run: |
          echo "Published cardanofoundation/adahandle-resolver:${{ steps.version.outputs.version }} and :latest from ${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
