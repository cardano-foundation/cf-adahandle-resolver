name: Run Tests

on:
  push:
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:

# Read-only by default (CodeQL actions/missing-workflow-permissions). Only the coverage job, which runs on main and
# pushes to gh-pages, can write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: |
          mvn --batch-mode --update-snapshots clean package -DskipTests

      - name: Test
        run: |
          mvn --batch-mode --update-snapshots test

      - name: Keep the coverage report
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: jacoco
          path: target/site/jacoco
          retention-days: 1

  # The JaCoCo report and badges on GitHub Pages, from main only.
  coverage:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get the coverage report
        uses: actions/download-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco

      - name: Publish coverage report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          BRANCH: gh-pages
          folder: target/site/jacoco
          target-folder: coverage-report/

      - name: Generate JaCoCo Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          badges-directory: build/reports/jacoco/test/html/badges

      - name: Log coverage percentage
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

      - name: Publish badges to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          BRANCH: gh-pages
          folder: build/reports/jacoco/test/html/badges
          target-folder: badges/
