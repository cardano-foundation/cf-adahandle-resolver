apiVersion: v2
name: adahandle-resolver
type: application
# Version of the resolver image deployed by default (image.tag empty). Set on release PRs by
# .github/workflows/helm-app-version.yaml.
appVersion: "1.0.0"

description: >
  A Helm chart for deploying the ADA Handle Resolver app, 
  which provides a scoped chain indexer for ADA Handle information, 
  exposed via REST using Yaci Store

keywords:
  - ada-handle
  - yaci-store
  - cardano
  - indexer
  - api

annotations:
  licenses: MIT

maintainers:
  - name: Cardano Foundation
    url: https://cardanofoundation.org
sources:
  - https://github.com/cardano-foundation/cf-adahandle-resolver

# 1.0.0: dropped the Bitnami PostgreSQL dependency (its image is no longer published).
version: 1.0.0