{{- if .Values.httpRoute.enabled }}
{{- if .Values.ingress.enabled }}
{{- fail "ingress.enabled and httpRoute.enabled are mutually exclusive" }}
{{- end }}
{{- if not .Values.httpRoute.hosts }}
{{- fail "httpRoute.hosts must list at least one hostname" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "adahandle-resolver.fullname" . }}
  labels:
    {{- include "adahandle-resolver.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - kind: {{ .Values.httpRoute.parentRef.kind | quote }}
      name: {{ .Values.httpRoute.parentRef.name | quote }}
      {{- if .Values.httpRoute.parentRef.namespace }}
      namespace: {{ .Values.httpRoute.parentRef.namespace | quote }}
      {{- end }}
  hostnames:
    {{- range .Values.httpRoute.hosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            value: /api/v1
        - path:
            type: Exact
            value: /apidocs
      backendRefs:
        - kind: Service
          name: {{ include "adahandle-resolver.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
