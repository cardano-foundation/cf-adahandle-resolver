replicaCount: 1

image:
  repository: cardanofoundation/adahandle-resolver
  tag: "0.1.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account to run the resolver pod under.
#
# The chart does NOT create a ServiceAccount resource — it only references an
# already-existing one (created out-of-band, e.g. via your platform's IAM/IRSA
# or a separate baseline chart). Leave `create: false` and set `name` to the SA
# you want to use. With `name: ""` the pod falls back to the namespace's
# `default` service account.
serviceAccount:
  name: ""

service:
  type: ClusterIP
  port: 9095

domain: "example.com"

ingress:
  enabled: true
  additionalDomains: []

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

diagnosticMode:
  enabled: false

springProfiles: mainnet,h2

## Configuring the time for the follower startup probe
startupProbe:
  initialDelaySeconds: 60
  periodSeconds: 20
  failureThreshold: 3

dbSchema: public

database:
  # Can be h2 or postgres
  type: h2
  # h2 configuration
  h2:
    url: jdbc:h2:/data/db
    # DB Username
    username: "adahandle"
    # DB Password
    password: "adahandle-CHANGEME"
    persistence:
      enabled: true
      storage:
        size: 5Gi
  # postgres configuration
  postgres:
    username: "adahandle"
    secret:
      name: "postgres-secrets"
      hostKey: POSTGRES_HOST
      portKey: POSTGRES_PORT
      dbKey: POSTGRES_DB
      userKey: POSTGRES_USER
      passwordKey: POSTGRES_PASSWORD


# Enable bitnami postgresql Helm chart
postgresql:
  enabled: false
  auth:
    autoGenerateSecret: false
    username: "adahandle"
    database: "adahandle"
    existingSecret: "postgres-secrets"
    secretKeys:
      userPasswordKey: POSTGRES_PASSWORD
      adminPasswordKey: POSTGRES_ADMIN_PASSWORD
      replicationPasswordKey: POSTGRES_REPLICATION_PASSWORD

# Provision a Postgres Cluster using Zalando postgres operator.
zpgCluster:
  enabled: false
  namespace: zpg-system
  dbName: adahandle
  instances: 1
  volumeSize: 5Gi 
  # Additional environment variables for the Zalando PostgreSQL pods
  additionalEnv: []
    # - name: EXAMPLE_VAR
    #   value: "example-value"
    # - name: EXAMPLE_SECRET
    #   valueFrom:
    #     secretKeyRef:
    #       name: my-secret
    #       key: my-key
  resources:
    # requests:
    #   cpu: 100m 
    #   memory: 512Mi
    # limits:
    #   cpu: 500m
    #   memory: 1024Mi
